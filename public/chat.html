<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChatApp</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell" id="appShell">

    <!-- ===== TOPBAR ===== -->
    <div class="topbar">
      <h1 id="pageTitle">Chats</h1>
    </div>

    <!-- ===== VIEW: CHATS (daftar teman) ===== -->
    <div class="view" id="viewChats">
      <div id="chatsList"></div>
    </div>

    <!-- ===== VIEW: CARI TEMAN ===== -->
    <div class="view hidden" id="viewFriends">
      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Ketik username teman...">
      </div>
      <div id="searchResults"></div>

      <div class="section-label" id="requestsLabel" style="display:none;">Permintaan Masuk</div>
      <div id="requestsList"></div>
    </div>

    <!-- ===== VIEW: PROFIL ===== -->
    <div class="view hidden" id="viewProfile">
      <div class="profile-card">
        <div class="profile-avatar" id="profileAvatar"></div>
        <div class="profile-name" id="profileName"></div>
        <div class="profile-sub">Online</div>
      </div>
      <div style="margin-top:18px;">
        <div class="settings-row danger" id="logoutBtn">
          Keluar
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </div>
      </div>
    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <div class="bottom-nav">
      <button class="nav-btn active" data-view="chats">
        <span class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </span>
        <span>Chats</span>
      </button>
      <button class="nav-btn" data-view="friends" id="friendsNavBtn">
        <span class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="nav-dot" id="friendsDot"></span>
        </span>
        <span>Teman</span>
      </button>
      <button class="nav-btn" data-view="profile">
        <span class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span>Profil</span>
      </button>
    </div>

    <!-- ===== CHAT WINDOW (overlay) ===== -->
    <div class="chat-window" id="chatWindow">
      <div class="chat-header">
        <button class="back-btn" id="backBtn">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="avatar" id="chatAvatar" style="width:36px;height:36px;font-size:14px;"></div>
        <div class="info">
          <div class="name" id="chatName"></div>
          <div class="status" id="chatStatus">offline</div>
        </div>
      </div>
      <div class="messages" id="messagesEl"></div>
      <div class="typing-indicator" id="typingIndicator"></div>
      <div class="chat-input-bar">
        <input type="text" id="messageInput" placeholder="Ketik pesan...">
        <button id="sendBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </div>
    </div>

  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
